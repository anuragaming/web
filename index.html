<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Anura Gaming</title>

<!-- Fonts: Fraunces (serif) + Inter (sans) + JetBrains Mono (nút) -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<style>
/* Cho phép xoay góc gradient mượt */
@property --angle {
  syntax: '<angle>';
  initial-value: 0deg;
  inherits: false;
}

* { margin:0; padding:0; box-sizing:border-box; }

:root {
  --rainbow: #fde047, #86efac, #5eead4, #60a5fa, #c084fc, #f472b6, #fde047;
}

html, body {
  height: 100%;
  width: 100vw;
  overflow-x: hidden; 
}

body {
  font-family: 'Inter', sans-serif;
  background: #050505;
  color: #fff;
  min-height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  padding: 20px;
  position: relative;
}

/* ===== Canvas Hạt Rơi ===== */
#particle-canvas {
  position: fixed;
  top: 0; left: 0;
  width: 100%; height: 100%;
  z-index: 0; /* Nằm dưới cùng */
  pointer-events: none;
}

/* ===== Nền: dot grid mờ ===== */
body::after {
  content: '';
  position: fixed; inset: 0;
  background-image: radial-gradient(rgba(255,255,255,0.06) 1px, transparent 1px);
  background-size: 26px 26px;
  mask-image: radial-gradient(ellipse at center, #000 30%, transparent 80%);
  -webkit-mask-image: radial-gradient(ellipse at center, #000 30%, transparent 80%);
  pointer-events: none;
  z-index: 0;
}

/* ===== Spotlight (Chỉ PC) ===== */
.spotlight {
  position: fixed; inset: 0;
  background: radial-gradient(420px circle at var(--mx,50%) var(--my,30%),
              rgba(124,92,255,0.18), rgba(34,211,238,0.08) 40%, transparent 70%);
  pointer-events: none;
  z-index: 1;
  transition: background 0.1s linear;
}

/* ===== Các blob màu nổi lềnh bềnh ===== */
.blob {
  position: fixed;
  border-radius: 50%;
  filter: blur(90px);
  opacity: 0.35;
  z-index: 0;
  pointer-events: none;
  animation: float 14s ease-in-out infinite;
}
.blob.b1 { width:380px; height:380px; background:#7c5cff; top:-100px; left:-100px; }
.blob.b2 { width:340px; height:340px; background:#22d3ee; bottom:-100px; right:-100px; animation-delay:-5s; }
.blob.b3 { width:300px; height:300px; background:#f472b6; top:35%; left:55%; animation-delay:-9s; opacity:0.22; }

@keyframes float {
  0%,100% { transform: translate(0,0) scale(1); }
  33% { transform: translate(30px,-20px) scale(1.05); }
  66% { transform: translate(-20px,20px) scale(0.95); }
}

/* ===== Card chính ===== */
.container {
  position: relative;
  z-index: 2;
  width: 100%;
  max-width: 480px;
  text-align: center;
  padding: 48px 30px 40px;
  border-radius: 28px;
  background: rgba(255,255,255,0.02);
  border: 1px solid rgba(255,255,255,0.08);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  transform-style: preserve-3d;
  transition: transform 0.2s ease-out;
  animation: cardIn 0.9s cubic-bezier(.2,.8,.2,1) both;
}

@keyframes cardIn {
  from { opacity:0; transform: translateY(30px) scale(.97); }
  to { opacity:1; transform: translateY(0) scale(1); }
}

/* ===== Tiêu đề ===== */
.hero-title {
  font-family: 'Fraunces', serif;
  font-weight: 600;
  line-height: 1.1;
  letter-spacing: -0.02em;
  font-size: 3.5rem;
  margin-bottom: 20px;
}
.white-line {
  display: block;
  color: #f5f5f5;
  font-size: 1.6rem;
  font-weight: 500;
  margin-bottom: 8px;
  font-family: 'Inter', sans-serif;
}
.rainbow-line {
  display: block;
  background: linear-gradient(90deg, var(--rainbow));
  background-size: 250% 100%;
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
  -webkit-text-fill-color: transparent;
  animation: flow 6s linear infinite;
  transition: opacity .45s ease, transform .45s ease, filter .45s ease;
  line-height: 1.2;
}

@keyframes flow {
  to { background-position: 250% 50%; }
}

.subtitle {
  font-size: 0.95rem;
  color: rgba(255,255,255,0.55);
  font-weight: 400;
  margin: 0 auto 30px;
  line-height: 1.6;
}

/* ===== Nút Google ===== */
.glow-btn {
  position: relative;
  isolation: isolate;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
  text-decoration: none;
  padding: 16px 36px;
  border-radius: 999px;
  margin-bottom: 35px;
  background: transparent;
  transition: transform .25s ease;
  cursor: pointer;
}
.glow-btn::before {
  content: '';
  position: absolute; inset: -3px;
  border-radius: inherit;
  background: conic-gradient(from var(--angle), var(--rainbow));
  filter: blur(12px);
  opacity: 0.85;
  z-index: -2;
  animation: spin 4s linear infinite;
}
.glow-btn::after {
  content: '';
  position: absolute; inset: 0;
  border-radius: inherit;
  background: #ffffff;
  z-index: -1;
  transition: background .25s ease;
}
.glow-btn span {
  position: relative; z-index: 1;
  font-family: 'JetBrains Mono', monospace;
  font-weight: 600;
  letter-spacing: 0.05em;
  text-transform: uppercase;
  font-size: 0.85rem;
  color: #0a0a0a;
  transition: transform 0.2s ease;
}

/* Hiệu ứng Shockwave khi Click nút */
.btn-shockwave {
  position: absolute;
  top: 50%; left: 50%;
  transform: translate(-50%, -50%);
  width: 100%; height: 100%;
  background: transparent;
  border: 2px solid #fff;
  border-radius: 999px;
  z-index: 0;
  pointer-events: none;
  animation: shockwaveAnim 0.5s ease-out forwards;
}

@keyframes shockwaveAnim {
  0% { width: 100%; height: 100%; opacity: 1; border-width: 4px; }
  100% { width: 150%; height: 180%; opacity: 0; border-width: 0px; }
}
@keyframes spin { to { --angle: 360deg; } }

/* ===== Divider ===== */
.divider {
  height: 1px;
  background: linear-gradient(90deg, transparent, rgba(255,255,255,0.12), transparent);
  margin: 0 0 26px;
}

/* ===== Danh sách link profile ===== */
.profile-links {
  display: flex;
  flex-direction: column;
  gap: 12px;
  text-align: left;
}
.link-item {
  position: relative;
  isolation: isolate;
  display: flex;
  align-items: center;
  gap: 14px;
  padding: 14px 18px;
  border-radius: 16px;
  text-decoration: none;
  color: #fff;
  background: rgba(13, 13, 15, 0.6);
  border: 1px solid rgba(255,255,255,0.06);
  overflow: hidden;
  transition: transform .3s cubic-bezier(.2,.8,.2,1), border-color .3s ease;
  opacity: 0;
  animation: fadeUp .6s cubic-bezier(.2,.8,.2,1) forwards;
}

.link-item:nth-child(1) { animation-delay: .15s; }
.link-item:nth-child(2) { animation-delay: .25s; }
.link-item:nth-child(3) { animation-delay: .35s; }
.link-item:nth-child(4) { animation-delay: .45s; }
.link-item:nth-child(5) { animation-delay: .55s; }

@keyframes fadeUp {
  from { opacity: 0; transform: translateY(16px); }
  to { opacity: 1; transform: translateY(0); }
}

@media (hover: hover) {
  .glow-btn:hover { transform: translateY(-2px) scale(1.03); }
  .glow-btn:hover::before { filter: blur(18px); opacity: 1; }
  
  .link-item:hover {
    transform: translateX(6px);
    border-color: transparent;
  }
  .link-item:hover::before { opacity: 1; }
  .link-item:hover::after { left: 130%; }
  .link-item:hover .arrow { opacity: 1; transform: translateX(0); color: #fff; }
}

.link-item::before {
  content: '';
  position: absolute; inset: -1px;
  border-radius: inherit;
  padding: 1px;
  background: linear-gradient(120deg, var(--rainbow));
  background-size: 200% 200%;
  -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
  -webkit-mask-composite: xor;
          mask-composite: exclude;
  opacity: 0;
  transition: opacity .3s ease;
  animation: flow 5s linear infinite;
  z-index: -1;
}

.link-item::after {
  content: '';
  position: absolute; top: 0; left: -120%;
  width: 60%; height: 100%;
  background: linear-gradient(90deg, transparent, rgba(255,255,255,0.12), transparent);
  transform: skewX(-20deg);
  transition: left .6s ease;
  z-index: 0;
}

.link-item i, .link-item .zalo-badge, .link-item span, .link-item .arrow { 
  position: relative; z-index: 1; 
}

.link-item i {
  font-size: 1.3rem;
  width: 30px;
  text-align: center;
  flex-shrink: 0;
}

.link-item span {
  flex: 1;
  font-size: 0.95rem;
  font-weight: 500;
  line-height: 1.3;
}

.link-item .arrow {
  font-size: 0.8rem;
  color: rgba(255,255,255,0.4);
  opacity: 0;
  transform: translateX(-8px);
  transition: all .3s ease;
}

.fa-youtube { color: #ff3b3b; }
.fa-tiktok { color: #fff; text-shadow: 1.5px 1.5px 0 #ff0050, -1.5px -1.5px 0 #00f2ea; }
.fa-discord { color: #7c8cff; }
.zalo-badge {
  background: #0068ff;
  color: #fff;
  width: 30px; height: 30px;
  border-radius: 8px;
  display: flex; align-items: center; justify-content: center;
  font-weight: 700; font-size: 0.6rem;
  flex-shrink: 0;
}

.footer {
  margin-top: 30px;
  font-size: 0.75rem;
  color: rgba(255,255,255,0.3);
  font-family: 'JetBrains Mono', monospace;
  letter-spacing: 0.05em;
}

@media (max-width: 480px) {
  body { padding: 16px; }
  .container { padding: 35px 20px 30px; border-radius: 24px; }
  .hero-title { font-size: 2.6rem; }
  .white-line { font-size: 1.2rem; }
  .subtitle { font-size: 0.85rem; margin-bottom: 24px; }
  .glow-btn { width: 100%; padding: 16px 20px; }
  .link-item { padding: 12px 14px; gap: 12px; }
  .link-item span { font-size: 0.9rem; }
  .link-item .arrow { opacity: 1; transform: translateX(0); }
  .blob { transform: scale(0.7); }
}
@media (prefers-reduced-motion: reduce) {
  * { animation: none !important; }
}
</style>
</head>
<body>

  <!-- Canvas cho hiệu ứng hạt rơi -->
  <canvas id="particle-canvas"></canvas>

  <div class="spotlight" id="spotlight"></div>
  
  <div class="blob b1"></div>
  <div class="blob b2"></div>
  <div class="blob b3"></div>

  <main class="container" id="card">
    <h1 class="hero-title">
      <span class="white-line">Chào mừng đến với</span>
      <span class="rainbow-line" id="dynamic-title">Anura Gaming</span>
    </h1>

    <p class="subtitle">Content Creator · Developer · Community Builder</p>

    <!-- Nút Google với ID để gán sự kiện click -->
    <a href="https://www.google.com" target="_blank" rel="noopener" class="glow-btn" id="action-btn">
      <span>Truy cập Google</span>
    </a>

    <div class="divider"></div>

    <div class="profile-links">
      <a href="https://www.youtube.com/@Anura-gaming-real" target="_blank" rel="noopener" class="link-item">
        <i class="fa-brands fa-youtube"></i>
        <span>Youtube</span>
        <i class="fa-solid fa-arrow-right arrow"></i>
      </a>
      <a href="https://tiktok.com/@nhatanh_hihi" target="_blank" rel="noopener" class="link-item">
        <i class="fa-brands fa-tiktok"></i>
        <span>TikTok</span>
        <i class="fa-solid fa-arrow-right arrow"></i>
      </a>
      <a href="https://zalo.me/g/mrzpvn566" target="_blank" rel="noopener" class="link-item">
        <div class="zalo-badge">ZALO</div>
        <span>Nhóm Zalo</span>
        <i class="fa-solid fa-arrow-right arrow"></i>
      </a>
      <a href="https://discord.gg/sWtCuDf6zw" target="_blank" rel="noopener" class="link-item">
        <i class="fa-brands fa-discord"></i>
        <span>Discord Meow Community</span>
        <i class="fa-solid fa-arrow-right arrow"></i>
      </a>
      <a href="https://discord.gg/6tymjRzs48" target="_blank" rel="noopener" class="link-item">
        <i class="fa-brands fa-discord"></i>
        <span>Discord Anura Community</span>
        <i class="fa-solid fa-arrow-right arrow"></i>
      </a>
    </div>

    <div class="footer">© 2026 NHẬT ANH DEV</div>
  </main>

<script>
  /* =========================================
     1. HỆ THỐNG HẠT RƠI (PARTICLES)
  ========================================= */
  const canvas = document.getElementById('particle-canvas');
  const ctx = canvas.getContext('2d');
  
  let width, height, particles;
  
  function initParticles() {
      width = canvas.width = window.innerWidth;
      height = canvas.height = window.innerHeight;
      particles = [];
      
      const particleCount = window.innerWidth < 768 ? 40 : 80; // Ít hạt hơn trên mobile
      
      for (let i = 0; i < particleCount; i++) {
          particles.push({
              x: Math.random() * width,
              y: Math.random() * height,
              radius: Math.random() * 1.5 + 0.5,
              speedY: Math.random() * 1.5 + 0.5, // Tốc độ rơi
              speedX: (Math.random() - 0.5) * 0.5, // Trôi dạt ngang
              opacity: Math.random() * 0.5 + 0.1
          });
      }
  }

  function drawParticles() {
      ctx.clearRect(0, 0, width, height);
      ctx.fillStyle = '#ffffff';
      
      particles.forEach(p => {
          p.y += p.speedY;
          p.x += p.speedX;
          
          // Nếu rớt khỏi màn hình thì quay lại trên cùng
          if (p.y > height) {
              p.y = -10;
              p.x = Math.random() * width;
          }
          
          ctx.globalAlpha = p.opacity;
          ctx.beginPath();
          ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
          ctx.fill();
      });
      requestAnimationFrame(drawParticles);
  }
  
  initParticles();
  drawParticles();
  window.addEventListener('resize', initParticles);

  /* =========================================
     2. HIỆU ỨNG SHOCKWAVE KHI CLICK NÚT
  ========================================= */
  const actionBtn = document.getElementById('action-btn');
  actionBtn.addEventListener('click', function(e) {
      e.preventDefault(); // Ngăn chặn chuyển trang ngay lập tức
      
      // Tạo phần tử sóng
      const shockwave = document.createElement('div');
      shockwave.classList.add('btn-shockwave');
      this.appendChild(shockwave);
      
      // Tạo hiệu ứng lún nút nhẹ
      this.style.transform = 'scale(0.95)';
      setTimeout(() => this.style.transform = '', 150);

      // Đợi 450ms cho hiệu ứng chạy xong rồi mới mở link
      setTimeout(() => {
          window.open(this.href, this.target || '_self');
          shockwave.remove();
      }, 450);
  });

  /* =========================================
     3. SPOTLIGHT CHUỘT VÀ TILT 3D
  ========================================= */
  const spotlight = document.getElementById('spotlight');
  const card = document.getElementById('card');
  const isTouch = window.matchMedia('(hover: none)').matches || ('ontouchstart' in window) || (navigator.maxTouchPoints > 0);
  
  if (!isTouch) {
    window.addEventListener('mousemove', (e) => {
      // Spotlight
      spotlight.style.setProperty('--mx', e.clientX + 'px');
      spotlight.style.setProperty('--my', e.clientY + 'px');
      
      // Tilt 3D
      const r = card.getBoundingClientRect();
      const cx = r.left + r.width / 2;
      const cy = r.top + r.height / 2;
      const rx = ((e.clientY - cy) / r.height) * -6;
      const ry = ((e.clientX - cx) / r.width)  *  6;
      card.style.transform = `perspective(900px) rotateX(${rx}deg) rotateY(${ry}deg)`;
    });
    window.addEventListener('mouseleave', () => {
      card.style.transform = 'perspective(900px) rotateX(0) rotateY(0)';
    });
  }

  /* =========================================
     4. ĐỔI TIÊU ĐỀ SAU 3 GIÂY
  ========================================= */
  document.addEventListener('DOMContentLoaded', () => {
    const t = document.getElementById('dynamic-title');
    setTimeout(() => {
      t.style.opacity = '0';
      t.style.transform = 'translateY(-12px)';
      t.style.filter = 'blur(8px)';
      setTimeout(() => {
        t.textContent = 'Nhật Anh DEV';
        document.title = 'Nhật Anh DEV'; 
        t.style.opacity = '1';
        t.style.transform = 'translateY(0)';
        t.style.filter = 'blur(0)';
      }, 450);
    }, 3000);
  });
</script>
</body>
</html>
